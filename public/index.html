<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151820"><title>LG TV Remote</title><link rel="stylesheet" href="style.css"></head><body><main><header><small>SMART REMOTE</small><h1>LG webOS</h1><p>32LM636BPTB</p></header><details open><summary>Connection settings</summary><label>TV IP address<input id="ip" placeholder="192.168.1.100" inputmode="decimal"></label><label>TV MAC address (optional, for wake)<input id="mac" placeholder="AA:BB:CC:DD:EE:FF"></label><button id="connect">Connect TV</button></details><p id="status" role="status">Disconnected</p><div class="row"><button class="power" data-key="OFF">⏻ OFF</button><button class="wake" id="wake">⏻ ON</button></div><div class="row"><button data-key="HOME">⌂ Home</button><button data-key="MENU">⚙ Settings</button><button data-key="BACK">↩ Back</button></div><section class="navigation"><button data-key="UP">▲</button><button data-key="LEFT">◀</button><button class="ok" data-key="ENTER">OK</button><button data-key="RIGHT">▶</button><button data-key="DOWN">▼</button></section><div class="row"><div class="rocker"><button data-key="VOLUP">+</button><span>VOL</span><button data-key="VOLDOWN">−</button></div><div class="rocker"><button data-key="MUTE">Mute</button><button data-key="INFO">Info</button></div><div class="rocker"><button data-key="CHUP">+</button><span>CH</span><button data-key="CHDOWN">−</button></div></div><section class="numbers" id="numbers"></section><div class="row"><button data-key="PLAY">▶ Play</button><button data-key="PAUSE">Ⅱ Pause</button></div><div class="row"><button class="netflix" data-key="NETFLIX">NETFLIX</button><button class="youtube" data-key="YOUTUBE">YouTube</button></div><p id="feedback" aria-live="polite"></p></main><script src="app.js"></script></body></html>
